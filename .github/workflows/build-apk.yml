name: Build Strike Arena APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK Licenses
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Restore debug keystore
        run: |
          if [ -f debug.keystore.base64 ] && [ ! -f debug.keystore ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Prepare APK asset
        run: cp app/build/outputs/apk/debug/app-debug.apk StrikeArena.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StrikeArena-APK
          path: StrikeArena.apk

      - name: Publish Direct Download Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view v1.0-latest >/dev/null 2>&1; then
            gh release upload v1.0-latest StrikeArena.apk --clobber
          else
            gh release create v1.0-latest StrikeArena.apk \
              --title "Strike Arena Mobile APK" \
              --notes "Автоматическая сборка APK для Android. Нажмите на файл StrikeArena.apk ниже, чтобы скачать и установить на телефон."
          fi
